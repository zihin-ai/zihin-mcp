name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run check:publication

      - name: Live integration tests
        run: npm test
        env:
          ZIHIN_API_KEY: ${{ secrets.ZIHIN_API_KEY }}
          REQUIRE_INTEGRATION: '1'

  publish:
    name: Publish to npm
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run check:publication

      - name: Publish package if the version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zihin/mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
