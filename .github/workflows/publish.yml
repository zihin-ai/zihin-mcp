# Publishes with npm Trusted Publishing (OIDC); no npm token is stored in this repository.
# One-time setup on npmjs.com: package @zihin/mcp-server -> Settings -> Trusted Publisher ->
# GitHub Actions: organization or user "zihin-ai", repository "zihin-mcp", workflow filename
# "publish.yml", no environment, with "npm publish" allowed. All fields are case-sensitive.
# npm does not validate the entry when it is saved: run this workflow manually with an empty
# release_tag to check it without publishing.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish; leave empty to validate only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    # An identity-only diagnostic must not invoke hosted agents or consume credits.
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release tag and ancestry
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run check:publication
      - name: Live integration tests
        run: npm test
        env:
          ZIHIN_API_KEY: ${{ secrets.ZIHIN_API_KEY }}
          REQUIRE_INTEGRATION: '1'

  publish:
    name: Publish to npm
    needs: [test]
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with Trusted Publishing support
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run check:publication
      - name: Publish package if the version is new
        env:
          # A manual retry checks out a historical tag, not the workflow commit.
          # Avoid attesting to the workflow commit as the package source in that case.
          PROVENANCE: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zihin/mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published."
            exit 0
          fi
          LOGS="$RUNNER_TEMP/npm-publish-logs"
          if ! npm publish --access public --provenance="$PROVENANCE" --logs-dir "$LOGS"; then
            if ! grep -qsh ' oidc Successfully retrieved and set token' "$LOGS"/*.log; then
              grep -sh ' oidc ' "$LOGS"/*.log | sed 's/^[0-9]* //' || true
              echo "::error::npm rejected the Trusted Publishing token exchange and fell back to a placeholder token. An E404 on publish is then an authorization failure, not a missing package. Check the trusted publisher entry described at the top of this workflow."
            fi
            exit 1
          fi

  trust:
    name: Verify npm trusted publisher
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with Trusted Publishing support
        run: npm install -g npm@11
      - run: npm ci
      - name: Exchange the workflow identity without publishing
        run: |
          # A dry run performs the OIDC token exchange and stops before the upload.
          # Its exit status is not the result: it also fails when the version on the
          # branch is already published, after the exchange has taken place.
          LOGS="$RUNNER_TEMP/npm-trust-logs"
          npm publish --dry-run --access public --provenance=false --logs-dir "$LOGS" || true
          if grep -qsh ' oidc Successfully retrieved and set token' "$LOGS"/*.log; then
            echo "npm accepted the OIDC identity for @zihin/mcp-server. Publication permissions, artifact checks, and release tests still apply."
          else
            grep -sh ' oidc ' "$LOGS"/*.log | sed 's/^[0-9]* //' || true
            echo "::error::npm did not accept this workflow as a trusted publisher of @zihin/mcp-server. Check the trusted publisher entry described at the top of this workflow."
            exit 1
          fi
