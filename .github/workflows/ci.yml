name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # Sem ZIHIN_API_KEY de propósito: a suíte de integração executa um
      # turno real de chat_with_agent (custo de LLM no tenant) — rodar isso a
      # cada push/PR queima token sem necessidade. Os testes de integração
      # rodam apenas no gate de publish (publish.yml, REQUIRE_INTEGRATION=1).
      - name: Testes (offline)
        run: npm test
